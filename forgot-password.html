<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset | Summit & Co. Events</title>
  <meta name="description" content="Recover your Summit & Co. Events client portal account password.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-body min-vh-100 d-flex flex-column justify-content-between">

  <!-- TOP RIGHT THEME & RTL CONTROLS -->
  <header class="w-100 p-3 p-md-4 d-flex justify-content-end align-items-center gap-2">
    <button class="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
    <button class="theme-toggle-btn rtl-toggle-btn" aria-label="Toggle RTL mode">RTL</button>
  </header>

  <!-- RECOVERY CONTAINER & CARD -->
  <main class="container px-3 my-auto py-3">
    <div class="mx-auto" style="max-width: 400px;">
      <div class="custom-card p-4 p-sm-5 border border-gold shadow-lg">
        
        <!-- BRAND NAME TOP CENTER -->
        <div class="text-center mb-4">
          <a class="navbar-brand-text fs-3 text-decoration-none d-inline-block mb-2" href="index.html">
            <i class="bi bi-layers-half text-gold"></i> SUMMIT & CO.
          </a>
          <span class="badge-gold d-block w-fit mx-auto mb-2" style="font-size: 0.7rem;">Account Recovery</span>
          <h1 class="font-serif fs-4 mb-1">Reset Portal Password</h1>
          <p class="text-secondary small mb-0">Enter your corporate email address to receive password reset instructions.</p>
        </div>

        <div class="alert alert-success d-none form-success-alert mb-3 small" role="alert">
          <i class="bi bi-envelope-check-fill me-2"></i> Reset instructions dispatched! Check your inbox.
        </div>

        <form class="needs-validation" id="forgotPasswordForm" novalidate>
          <div class="mb-3">
            <label for="resetEmail" class="form-label form-label-custom small">Corporate Email *</label>
            <input type="email" class="form-control form-control-custom" id="resetEmail" placeholder="name@company.com" required>
            <div class="invalid-feedback">Please enter a valid work email address.</div>
          </div>

          <button type="submit" class="btn btn-gold w-100 py-2.5 mb-3">Send Reset Instructions <i class="bi bi-send ms-2"></i></button>

          <div class="text-center border-top border-secondary border-opacity-25 pt-3">
            <a href="login.html" class="text-gold fw-semibold small"><i class="bi bi-arrow-left me-1"></i> Return to Portal Login</a>
          </div>
        </form>
      </div>

      <div class="text-center mt-3">
        <a href="index.html" class="text-muted small link-underline-hover"><i class="bi bi-arrow-left me-1"></i> Back to Main Website</a>
      </div>
    </div>
  </main>

  <!-- Back to Top Button -->
  <button id="backToTopBtn" title="Back to top" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
